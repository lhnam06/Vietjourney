spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vietjourney}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 15000
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
server:
  port: ${PORT:8082}
  address: 0.0.0.0
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
place:
  datasource:
    enabled: ${PLACE_DB_ENABLED:true}
    url: ${PLACE_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/vietjourney}}
    username: ${PLACE_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${PLACE_DB_PASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 15000
  lookup:
    food-table: ${PLACE_DB_FOOD_TABLE:places_food}
    drink-table: ${PLACE_DB_DRINK_TABLE:places_drink}
    activity-table: ${PLACE_DB_ACTIVITY_TABLE:places_activity}
    id-column: ${PLACE_DB_ID_COLUMN:id}

jwt:
  signer_key: ${JWT_SIGNER_KEY:change-this-dev-only-signer-key-with-at-least-64-characters}
  valid_duration: 36000
  refreshable_duration: 604800
