spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://REMOVED_SUPABASE_HOST:6543/postgres?prepareThreshold=0}
    username: ${DB_USERNAME:REMOVED_SUPABASE_USERNAME}
    password: ${DB_PASSWORD:REMOVED_SUPABASE_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 15000
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:false}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
server:
  port: ${PORT:8082}
  address: 0.0.0.0
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
place:
  datasource:
    enabled: ${PLACE_DB_ENABLED:true}
    url: ${PLACE_DB_URL:jdbc:postgresql://REMOVED_SUPABASE_HOST:6543/postgres?prepareThreshold=0}
    username: ${PLACE_DB_USERNAME:REMOVED_SUPABASE_USERNAME}
    password: ${PLACE_DB_PASSWORD:REMOVED_SUPABASE_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 15000
  lookup:
    food-table: ${PLACE_DB_FOOD_TABLE:places_food}
    drink-table: ${PLACE_DB_DRINK_TABLE:places_drink}
    activity-table: ${PLACE_DB_ACTIVITY_TABLE:places_activity}
    id-column: ${PLACE_DB_ID_COLUMN:id}

jwt:
  signer_key: ${JWT_SIGNER_KEY:REMOVED_JWT_SIGNER_KEY}
  valid_duration: 36000
  refreshable_duration: 604800
