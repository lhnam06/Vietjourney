server:
  port: 8080

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://localhost:5433/chat_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  websocket:
    relay-port: 61613

logging:
  level:
    org.springframework.amqp: INFO
    org.springframework.web.socket: INFO
